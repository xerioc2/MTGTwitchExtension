spring:
  application:
    name: mtgo-twitch-extension-backend

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

mtgo:
  focus:
    enabled: ${MTGO_FOCUS_ENABLED:true}
    poll-interval: ${MTGO_FOCUS_POLL_INTERVAL:PT0.75S}
  log:
    path: ${MTGO_LOG_PATH:}
    backfill-bytes: ${MTGO_LOG_BACKFILL_BYTES:5242880}
    rediscovery-interval: ${MTGO_LOG_REDISCOVERY_INTERVAL:PT30S}
    rediscovery-hysteresis: ${MTGO_LOG_REDISCOVERY_HYSTERESIS:PT10S}
  debug:
    raw-log: ${MTGO_DEBUG_RAW_LOG:false}

twitch:
  client-id: ${TWITCH_CLIENT_ID:i68wrrm8hl8qzvtbyupokyg0a8d9sd}

screen-detections:
  enabled: ${ENABLE_SCREEN_DETECTIONS:false}
  mock-enabled: ${ENABLE_SCREEN_DETECTIONS_MOCK:false}
  ttl: ${SCREEN_DETECTIONS_TTL:PT2S}
  detector:
    enabled: ${ENABLE_SCREEN_DETECTOR:false}
    mode: ${SCREEN_DETECTOR_MODE:none}
    min-interval: ${SCREEN_DETECTOR_MIN_INTERVAL:PT1S}
    auto-run: ${SCREEN_DETECTOR_AUTO_RUN:false}
    scan-interval: ${SCREEN_DETECTOR_SCAN_INTERVAL:PT5S}
    capture:
      mode: ${SCREEN_DETECTOR_CAPTURE_MODE:none}
      max-width: ${SCREEN_DETECTOR_MAX_WIDTH:1280}
    calibration:
      x: ${SCREEN_DETECTOR_CALIBRATION_X:0.0}
      y: ${SCREEN_DETECTOR_CALIBRATION_Y:0.0}
      w: ${SCREEN_DETECTOR_CALIBRATION_W:1.0}
      h: ${SCREEN_DETECTOR_CALIBRATION_H:1.0}
    obs:
      url: ${SCREEN_DETECTOR_OBS_URL:ws://127.0.0.1:4455}
      password: ${SCREEN_DETECTOR_OBS_PASSWORD:}
      source-name: ${SCREEN_DETECTOR_OBS_SOURCE_NAME:}
    opencv:
      min-area: ${SCREEN_DETECTOR_OPENCV_MIN_AREA:0.0025}
      max-area: ${SCREEN_DETECTOR_OPENCV_MAX_AREA:0.25}
      max-regions: ${SCREEN_DETECTOR_OPENCV_MAX_REGIONS:20}
    ocr:
      enabled: ${SCREEN_DETECTOR_OCR_ENABLED:false}
      executable: ${SCREEN_DETECTOR_OCR_EXECUTABLE:tesseract}
    template:
      enabled: ${SCREEN_DETECTOR_TEMPLATE_ENABLED:true}
    min-confidence: ${SCREEN_DETECTOR_MIN_CONFIDENCE:0.72}

supabase:
  channel-id: ${SUPABASE_CHANNEL_ID:}
  relay-function-url: ${SUPABASE_RELAY_FUNCTION_URL:}
  card-resolver-function-url: ${SUPABASE_CARD_RESOLVER_FUNCTION_URL:}
  bridge-publish-token: ${BRIDGE_PUBLISH_TOKEN:}
  publish-min-interval: ${SUPABASE_PUBLISH_MIN_INTERVAL:PT1S}
  publish-heartbeat-interval: ${SUPABASE_PUBLISH_HEARTBEAT_INTERVAL:PT15S}
  metrics-log-interval: ${SUPABASE_METRICS_LOG_INTERVAL:PT5M}
  issue-token-url: ${SUPABASE_ISSUE_TOKEN_URL:https://lgzmxstmqzwjbmurstye.supabase.co/functions/v1/issue-bridge-token}
